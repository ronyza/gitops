apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: portal
data:
  config.yml: |
    title: "Home Lab Portal"
    subtitle: "Platform Services"
    header: true
    footer: false
    theme: default
    colors:
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"

    services:
      - name: "Platform"
        icon: "fas fa-cubes"
        items:
          - name: "ArgoCD"
            subtitle: "GitOps Continuous Delivery"
            tag: "ops"
            url: "https://argocd.local:30443"
            target: "_blank"

          - name: "Grafana"
            subtitle: "Metrics & Dashboards"
            tag: "observability"
            url: "https://grafana.local:30443"
            target: "_blank"

          - name: "Prometheus"
            subtitle: "Time-series database"
            tag: "observability"
            url: "https://prometheus.local:30443"
            target: "_blank"

          - name: "RabbitMQ"
            subtitle: "Message Broker"
            tag: "messaging"
            url: "https://rabbitmq.local:30443"
            target: "_blank"

          - name: "Kubernetes Dashboard"
            subtitle: "Cluster UI"
            tag: "ops"
            url: "https://dashboard.local:30443"
            target: "_blank"

          - name: "Hubble UI"
            subtitle: "Network Observability"
            tag: "observability"
            url: "https://hubble.local:30443"
            target: "_blank"
