apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: hubble-ui
    targetRevision: 1.14.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true