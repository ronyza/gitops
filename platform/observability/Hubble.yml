apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cilium/hubble-ui.git
    targetRevision: v0.13.0
    path: install/kubernetes/hubble-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
